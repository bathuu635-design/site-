<!DOCTYPE html><html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little BO — Admin</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Nunito,system-ui,sans-serif}</style></head><body class="bg-[#fffaf8] text-slate-700 min-h-screen">
<div id="login" class="min-h-screen grid place-items-center p-4"><div class="bg-white rounded-3xl shadow-xl p-8 w-full max-w-md border border-pink-100"><div class="text-center"><div class="text-5xl">🧸</div><h1 class="text-3xl font-black text-[#65505a] mt-3">Little BO Admin</h1><p class="text-slate-500 mt-1">Бараа бүтээгдэхүүн удирдах</p></div><form id="loginForm" class="mt-7 space-y-4"><input id="username" required class="w-full border rounded-2xl px-4 py-3 outline-none" placeholder="Нэвтрэх нэр"><input id="password" required type="password" class="w-full border rounded-2xl px-4 py-3 outline-none" placeholder="Нууц үг"><button class="w-full py-3 rounded-2xl bg-[#65505a] text-white font-black">Нэвтрэх</button><p id="loginError" class="text-red-500 text-sm text-center"></p></form></div></div>
<div id="panel" class="hidden"><header class="bg-white border-b sticky top-0 z-20"><div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center"><div><h1 class="text-2xl font-black text-[#65505a]">Little BO Admin 🧸</h1><p class="text-xs text-slate-500">Бүтээгдэхүүний удирдлага</p></div><div class="flex gap-2"><a href="index.html" class="px-4 py-2 rounded-full bg-pink-50 font-bold">Дэлгүүр харах</a><button id="logout" class="px-4 py-2 rounded-full bg-slate-100 font-bold">Гарах</button></div></div></header>
<main class="max-w-7xl mx-auto p-4 sm:p-6"><div class="grid lg:grid-cols-3 gap-6"><section class="lg:col-span-1 bg-white rounded-3xl p-6 shadow-sm border border-pink-100"><h2 class="text-xl font-black" id="formTitle">Шинэ бараа нэмэх</h2><form id="productForm" class="mt-5 space-y-3"><input id="pId" required class="w-full border rounded-xl px-3 py-2" placeholder="Код: BO-009"><input id="pName" required class="w-full border rounded-xl px-3 py-2" placeholder="Барааны нэр"><input id="pPrice" required type="number" min="0" class="w-full border rounded-xl px-3 py-2" placeholder="Үнэ (₮)"><select id="pCategory" class="w-full border rounded-xl px-3 py-2"><option value="Babies">Нялхас</option><option value="Girls">Охид</option><option value="Boys">Хөвгүүд</option><option value="Shoes">Гутал, аксессуар</option></select><input id="pRating" required type="number" min="1" max="5" value="5" class="w-full border rounded-xl px-3 py-2" placeholder="Үнэлгээ"><input id="pImage" required class="w-full border rounded-xl px-3 py-2" placeholder="Зургийн URL"><div class="flex gap-2"><button class="flex-1 py-3 rounded-xl bg-pink-400 text-white font-black">Хадгалах</button><button type="button" id="cancelEdit" class="hidden px-4 rounded-xl bg-slate-100 font-bold">Болих</button></div></form><p class="mt-4 text-xs text-slate-400">Анхаарах: энэ энгийн GitHub Pages хувилбарын өөрчлөлт зөвхөн тухайн браузерийн LocalStorage-д хадгалагдана.</p></section><section class="lg:col-span-2"><div class="bg-white rounded-3xl p-6 shadow-sm border border-pink-100"><div class="flex justify-between items-center"><h2 class="text-xl font-black">Бүх бүтээгдэхүүн</h2><span id="count" class="text-sm font-bold text-pink-500"></span></div><div id="adminProducts" class="mt-5 space-y-3"></div></div></section></div></main></div>
<script>
const KEY='littlebo_products_v1';const DEFAULT=[{id:'BO-001',name:'Зөөлөн Bunny комбинзон',price:59000,category:'Babies',rating:5,image:'https://images.unsplash.com/photo-1518831959646-742c3a14ebf7?auto=format&fit=crop&w=700&q=80'}];let products=JSON.parse(localStorage.getItem(KEY)||'null')||DEFAULT;let editing=null;
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('mn-MN').format(n)+'₮';
$('loginForm').onsubmit=e=>{e.preventDefault();if($('username').value==='12345678'&&$('password').value==='87654321'){$('login').classList.add('hidden');$('panel').classList.remove('hidden');render()}else $('loginError').textContent='Нэвтрэх нэр эсвэл нууц үг буруу байна.'};
$('logout').onclick=()=>{location.reload()};
function render(){ $('count').textContent=products.length+' бараа';$('adminProducts').innerHTML=products.map(p=>`<div class="flex gap-3 items-center border rounded-2xl p-3"><img src="${p.image}" class="w-16 h-16 rounded-xl object-cover"><div class="flex-1 min-w-0"><b class="block truncate">${p.name}</b><span class="text-xs text-slate-500">${p.id} · ${p.category} · ${money(p.price)}</span></div><button onclick="edit('${p.id}')" class="px-3 py-2 rounded-xl bg-blue-50 text-blue-600 font-bold">Засах</button><button onclick="del('${p.id}')" class="px-3 py-2 rounded-xl bg-red-50 text-red-500 font-bold">Устгах</button></div>`).join('')}
$('productForm').onsubmit=e=>{e.preventDefault();const p={id:$('pId').value.trim(),name:$('pName').value.trim(),price:Number($('pPrice').value),category:$('pCategory').value,rating:Number($('pRating').value),image:$('pImage').value.trim()};if(editing){const i=products.findIndex(x=>x.id===editing);if(i>-1)products[i]=p}else{if(products.some(x=>x.id===p.id))return alert('Энэ код аль хэдийн байна.');products.push(p)}save();reset();render()};
function edit(id){const p=products.find(x=>x.id===id);if(!p)return;editing=id;$('formTitle').textContent='Бараа засах';['pId','pName','pPrice','pCategory','pRating','pImage'].forEach((x)=>$(x).value={pId:p.id,pName:p.name,pPrice:p.price,pCategory:p.category,pRating:p.rating,pImage:p.image}[x]);$('pId').disabled=true;$('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function del(id){if(confirm('Энэ барааг устгах уу?')){products=products.filter(x=>x.id!==id);save();render()}}
function reset(){editing=null;$('productForm').reset();$('pRating').value=5;$('pId').disabled=false;$('formTitle').textContent='Шинэ бараа нэмэх';$('cancelEdit').classList.add('hidden')}$('cancelEdit').onclick=reset;function save(){localStorage.setItem(KEY,JSON.stringify(products))}
</script></body></html>
